<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Renderer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div class="chart-info">
            <div class="v-container">
                <div class="drop-zone" id="drop-zone">
                    <h4>upload or drop json file</h4>
                </div>
                <button id="toggle-button" class="toggle-button">
                    Enemy Render OFF
                </button>
            </div>
            <table class="description-table">
                <tr>
                    <td>Song Name</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>Difficulty</td>
                    <td>-(-)</td>
                </tr>
                <tr>
                    <td>BPM</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>Max Combo</td>
                    <td>-</td>
                </tr>
                <tr>
                    <td>Max Score</td>
                    <td>-</td>
                </tr>
            </table>
        </div>
    </div>

    <div class="chart-div">
        <canvas class="chart-canvas" id="chart-canvas"></canvas>
        <canvas class="chart-canvas" id="chart-canvas-er"></canvas>
    </div>
    <script src="rift_essentials.js"></script>
    <script src="render.js"></script>
    <script src="onload.js"></script>
</body>
</html>
