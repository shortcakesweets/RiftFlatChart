<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Card temp</title>
        <link rel="stylesheet" href="../css/card.css" />
    </head>
    <body>
        <div class="card">
            <div class="card-image">
                <img src="../../data/album_arts/RRBaboosh.webp" alt="Album Art" />
            </div>
            <div class="card-text">
                <div class="card-title">Song Title</div>
                <div class="card-subtitle">Artist Name</div>
            </div>
            <div class="card-difficulty">
                <div class="difficulty">3</div>
                <div class="difficulty">7</div>
                <div class="difficulty">11</div>
                <div class="difficulty">21</div>
            </div>
        </div>
    </body>
</html>
